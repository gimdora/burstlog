{% comment %}Base layout used by every page. Has the header and the CSS.{% endcomment %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Reading Tracker{% endblock %}</title>
    <style>
        :root { --accent: #2a6df4; --line: #ddd; --muted: #666; }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
            max-width: 720px;
            margin: 2rem auto;
            padding: 0 1rem;
            color: #222;
            line-height: 1.5;
        }
        header {
            border-bottom: 2px solid #444;
            padding-bottom: 0.5rem;
            margin-bottom: 1.5rem;
        }
        header h1 { margin: 0; font-size: 1.6rem; }
        header a { color: inherit; text-decoration: none; }
        h2 { margin-top: 2rem; }
        a { color: var(--accent); text-decoration: none; }
        a:hover { text-decoration: underline; }
        form {
            margin: 1rem 0;
            padding: 1rem;
            background: #f6f6f6;
            border-radius: 6px;
        }
        label { display: block; font-weight: 600; margin-top: 0.5rem; }
        input, select, textarea {
            width: 100%;
            padding: 0.45rem;
            margin-top: 0.25rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            font: inherit;
        }
        button {
            margin-top: 0.75rem;
            padding: 0.5rem 1rem;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font: inherit;
        }
        button:hover { opacity: 0.9; }
        .book-item, .note-item {
            padding: 0.75rem 0;
            border-bottom: 1px solid var(--line);
        }
        .status { font-size: 0.85rem; color: var(--muted); }
        .empty { color: var(--muted); font-style: italic; }
    </style>
</head>
<body>
    <header>
        <h1><a href="{% url 'book_list' %}">📚 Reading Tracker</a></h1>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
